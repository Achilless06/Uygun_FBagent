[project]
name = "uygun-fbagent"
version = "0.1.0"
description = "Facebook AI agent for Uygun Georgia — generates Georgian posts with human-in-the-loop Telegram approval."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conservative defaults: pyflakes (F), pycodestyle errors (E), isort (I), bugbear (B).
select = ["E", "F", "I", "B", "W"]
ignore = [
    "E501",  # line length (we have line-length=100 already and some Georgian strings are long)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert False in tests
# FastAPI dependency-injection idioms require call expressions in argument
# defaults (Depends, File, Form, etc.) — that's exactly what B008 forbids.
"src/web/auth.py" = ["B008"]
"src/web/routes/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
